# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push
  push:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: k8s-opencast
    # Set permissions of the job
    permissions:
      contents: read
      packages: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Inject enhanced GitHub environment variables
        uses: rlespinasse/github-slug-action@v5

      - name: Build ILIAS image
        uses: opencast-ilias/actions/build-ilias@main
        with:
          ilias_image: "srsolutions/ilias:9"
          destination: ghcr.io/${{ env.GITHUB_REPOSITORY_SLUG }}:${{ github.sha }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    runs-on: k8s-opencast
    needs: build
    steps:
      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Configure Kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Inject enhanced GitHub environment variables
        uses: rlespinasse/github-slug-action@v5

      - name: Deploy the Helm chart
        uses: opencast-ilias/actions/deploy-ilias@main
        with:
          namespace: review-${{ env.GITHUB_REF_NAME_SLUG_URL }}
          image_repository: ghcr.io/${{ env.GITHUB_REPOSITORY_SLUG }}
          image_tag: ${{ github.sha }}
          ingress_hostname: ${{ env.GITHUB_REF_NAME_SLUG_URL }}.opencast.k8s.sr.solutions
