# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches:
      - "main"
      - "release_*"
      - "feature/9/use_k8s_for_builds"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: k8s-opencast

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ILIAS image
        uses: docker://ghcr.io/opencast-ilias/docker-ilias-image-builder
        env:
          ILIAS_IMAGE: "srsolutions/ilias:9"
          TARGET_DIR: /var/www/html
          DESTINATION: ghcr.io/opencast-ilias/reviewapps:${{ github.sha }}
        with:
          entrypoint: /usr/local/bin/build-ilias-image
          args: --skip-push-permission-check
